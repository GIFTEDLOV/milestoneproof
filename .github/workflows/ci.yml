name: exact-source-quality
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install test and GenVM lint tools
        run: python -m pip install --disable-pip-version-check pytest genvm-linter
      - name: Mocked contract and adversarial hardening tests
        run: python -m pytest -q --import-mode=importlib tests
      - name: Secret leak audit
        run: node scripts/secret_scan.mjs
      - name: Actual GenVM lint and schema
        run: |
          set -euo pipefail
          genvm-lint check contracts/milestoneproof.py
          genvm-lint schema contracts/milestoneproof.py --json > /tmp/abi.json
          test -s /tmp/abi.json
          python -m py_compile contracts/milestoneproof.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Build actual frontend
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run check
          npm run build
          test -s dist/index.html
